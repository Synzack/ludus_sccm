---
- name: Create release cache on the controller
  ansible.builtin.file:
    path: '{{ ludus_install_directory }}/resources/sccm/{{ ludus_sccm_cache_namespace }}'
    state: directory
    mode: '0770'
  delegate_to: localhost
  vars:
    ansible_become: false

- name: Cache installer on the controller
  ansible.builtin.get_url:
    url: '{{ ludus_sccm_url }}'
    dest: '{{ ludus_install_directory }}/resources/sccm/{{ ludus_sccm_cache_namespace }}/{{ ludus_sccm_file_name }}'
    checksum: '{{ ludus_sccm_checksum | default(omit) }}'
    mode: '0660'
    timeout: 120
  delegate_to: localhost
  vars:
    ansible_become: false

- name: Create guest download directory
  ansible.windows.win_file:
    path: '{{ ludus_sccm_download_path | default(ludus_sccm_media_path) }}'
    state: directory

- name: Copy cached installer to guest and verify contents
  ansible.windows.win_copy:
    src: '{{ ludus_install_directory }}/resources/sccm/{{ ludus_sccm_cache_namespace }}/{{ ludus_sccm_file_name }}'
    dest: '{{ ludus_sccm_download_path | default(ludus_sccm_media_path) }}\{{ ludus_sccm_file_name }}'
