---
- name: Download SQL Server 2022
  ansible.builtin.include_tasks:
    file: download_file.yml
  vars:
    ludus_sccm_file_name: SQLServer2022-x64-ENU.iso
    ludus_sccm_url: "{{ ludus_sccm_sql2022_url }}"
    ludus_sccm_host_path: "C:\\ludus\\sccm"

- name: Mount SQL ISO
  community.windows.win_disk_image:
    image_path: C:\ludus\sccm\SQLServer2022-x64-ENU.iso
    state: present
  register: disk_image_out

- name: Create SQL Service Account
  microsoft.ad.user:
    name: '{{ ludus_sccm_sql_svc_account_username }}'
    password: '{{ ludus_sccm_sql_svc_account_password }}'
    state: present
    spn:
      set:
        - 'MSSQLSvc/{{ ludus_sccm_sql_server_hostname }}:1433'
        - 'MSSQLSvc/{{ ludus_sccm_sql_server_hostname }}.{{ ludus_domain_fqdn }}:1433'
  vars:
    ansible_become: true
    ansible_become_method: runas
    ansible_become_user: '{{ ludus_domain_fqdn }}\{{ defaults.ad_domain_admin }}'
    ansible_become_password: '{{ defaults.ad_domain_admin_password }}'
    ansible_become_flags: "logon_type=interactive logon_flags=with_profile"

- name: Setup SQL Server - This will take a while
  no_log: true
  register: sccm_sql_install
  failed_when: sccm_sql_install.rc | default(0) not in [0, 3010]
  ansible.windows.win_command:
    argv:
      - '{{ disk_image_out.mount_paths[0] }}setup.exe'
      - /Q
      - /IAcceptSQLServerLicenseTerms
      - /ACTION=install
      - /FEATURES=SQL
      - /INSTANCENAME=MSSQLSERVER
      - '/SQLSYSADMINACCOUNTS={{ ludus_domain_netbios_name }}\{{ hostvars["localhost"]["ludus_sccm_site_server_samaccountname"] }}'
      - '{{ ludus_domain_netbios_name }}\{{ defaults.ad_domain_admin }}'
      - '/SQLSVCACCOUNT={{ ludus_domain_netbios_name }}\{{ ludus_sccm_sql_svc_account_username }}'
      - '/SQLSVCPASSWORD={{ ludus_sccm_sql_svc_account_password }}'
      - /SQLMINMEMORY=1024
      - '/SQLMAXMEMORY={{ ludus_sccm_sql_max_memory_mb }}'
      - /SQLCOLLATION=SQL_Latin1_General_CP1_CI_AS
      - /TCPENABLED=1
  vars:
    ansible_become: true
    ansible_become_method: runas
    ansible_become_user: '{{ ludus_domain_fqdn }}\{{ defaults.ad_domain_admin }}'
    ansible_become_password: '{{ defaults.ad_domain_admin_password }}'
    ansible_become_flags: "logon_type=interactive logon_flags=with_profile"
  args:
    creates: "C:\\Program Files\\Microsoft SQL Server\\MSSQL16.MSSQLSERVER\\MSSQL\\Binn\\sqlservr.exe"

- name: Reboot after SQL setup when required
  ansible.windows.win_reboot:
  when: sccm_sql_install.rc | default(0) == 3010

- name: Unmount ISO
  community.windows.win_disk_image:
    image_path: C:\ludus\sccm\SQLServer2022-x64-ENU.iso
    state: absent
